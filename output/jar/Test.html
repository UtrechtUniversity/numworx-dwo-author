<HTML>
<HEAD>
<TITLE>Balans met fruit</TITLE>
</HEAD>
<BODY>
<h2>Balans met fruit</h2>
Een applet voor rekenweb.<p>
De balans met fruit is de eerste applet in een geplande serie
met rekenproblemen
die over vergelijken gaan.<br>
Bij deze applet: wat kun je zeggen over de verhoudingen van het
gewicht van de
verschillende soorten fruit?<hr>
<APPLET 
ALIGN=CENTER  
ARCHIVE="balansfruitapplet.jar"
CODE="fi/balansfruit/BalansFruitApplet.class"
width=520
height=360>
<PARAM NAME=language VALUE="nl">
<PARAM NAME=aantalSoorten VALUE="3">
<PARAM NAME=aantal1 VALUE="5">
<PARAM NAME=gewicht1 VALUE="3.0">
<PARAM NAME=plaatje1 VALUE="perzik.gif">
<PARAM NAME=aantal2 VALUE="5">
<PARAM NAME=gewicht2 VALUE="4.0">
<PARAM NAME=plaatje2 VALUE="appel.gif">
<PARAM NAME=aantal3 VALUE="5">
<PARAM NAME=gewicht3 VALUE="5.0">
<PARAM NAME=plaatje3 VALUE="peer.gif">
</APPLET>
<hr>
</BODY>
</HTML>
