<HTML>
<HEAD>
</HEAD>
<BODY>
<APPLET
	code	= "fi.verknippen.Verknippen.class"
	width	= "790"
	height	= "485"
	archive = "verknippen.jar">
	<!-- internationalisatie -->	
	<PARAM name="language" value="nl"/>
	<!-- achtergrondkleur -->	
	<PARAM name="bgcolor" value="#FFFFC6"/>
	
	<!-- het nummer van de taak, elke taak heeft zijn
		 eigen html 
		 er zijn drie taaknummers mogelijk:
		 1: de tangramversie van Frans: figuur verknippen
		 	en proberen met de stukjes een rechthoek te leggen
		 2: de oppervlakteversie van Monica, klikken op de groene balletjes op de
		    stukjes laat een groen label tevoorschijn komen
		    dat is leeg of toont een ingevulde oppervlakte
		    klikken op het label toont een invulveld
		 3: de oppervlakteversie van Monica, variant:
		    er hangen altijd doorzichtige labels aan de stukjes
		    daarin .... of een ingevulde oppervlakte
		    klikken op het label toont een invulveld    
		 4: vergelijk-versie van Frans: er zijn twee figuren, een grijze
		 	linkerfiguur, niet verknipbaar of verschuifbaar en een rode
		 	rechterfiguur, wel verknipbaar en verschuifbaar;
		 	llg moet antwoorden welke figuur de grootste oppervlakte
		 	heeft   
		 default 1 -->

	<PARAM name="taaknummer" value="4"/>		

	<!-- toon het rooster, default no
		 -->
	<PARAM name="toonrooster" value="yes"/>		

	<!-- toon een schaduw van de beginfiguur
		 deze figuur ligt bij opstarten onder de beginfiguur
		 default no -->
	<PARAM name="toonschaduw" value="no"/>			 
	
	<!-- toon de afmetingen van de schaduw 
		 van de beginfiguur, je moet dan wel 
		 toonschaduw op yes zetten!! 
		 default no -->
	<PARAM name="toonafmetingen" value="no"/>			 
	
	<!-- voor de RSI-ers en wijndrinkers 
		 grotere balletjes, makkelijker aanklikken 
		 default no -->
	<PARAM name="groteballetjes" value="yes"/>			 			 		

	<!-- het aantal figuren voor deze taak 
		 maximum 10 -->
	<PARAM name="aantalfiguren" value="6"/>		
	
	<!-- de figuren voor deze taak 
		 geef de roostercoordinaten als 2 getallen gescheiden
		 door een komma, zet tussen de paren een |-teken 
		 volgorde paren: loop met de klok mee langs de rand!! 
		 
		 je mag elke figuur een eigen grid-size meegeven
		 >= 16 en <= 50, liefst een even getal
		 default gridsize is 20 pixels 
		 
		 bij de oppervlakteversie van Monica en de vergelijk-versie
		 van Frans (taaknummer 2, 3 of 4) MOET je ook de oppervlakte 
		 (van de rode figuur) toevoegen (het antwoord in de versies
		 van Monica)
		 
		 bij de vergelijk-versie van Frans MOET je ook de
		 roostercoordinaten van de grijze figuur EN de oppervlakte
		 van de grijze figuur toevoegen
		 -->
		 
	<PARAM name="figuur1" value="0,0|2,0|2,2|8,2|8,4|5,4|5,7|3,7|3,6|0,6"/>				
	<PARAM name="grid1" value="26"/>			
	<PARAM name="oppervlakte1" value="32"/>					
	<PARAM name="figuurgrijs1" value="3,0|8,0|8,2|7,2|7,4|5,4|5,5|3,5|3,6|0,6|0,2|3,2"/>					
	<PARAM name="oppervlaktegrijs1" value="32"/>					
	
	<PARAM name="figuur2" value="0,0|2,0|2,2|8,2|8,4|6,4|6,6|4,6|4,8|2,8|2,4|0,4"/>					
	<PARAM name="grid2" value="24"/>	
	<PARAM name="oppervlakte2" value="32"/>						
	<PARAM name="figuurgrijs2" value="0,0|3,0|3,1|5,1|5,0|8,0|8,2|6,2|6,6|2,6|2,2|0,2"/>					
	<PARAM name="oppervlaktegrijs2" value="30"/>					
	
	<PARAM name="figuur3" value="3,0|11,0|8,8|0,8"/>											
	<PARAM name="grid3" value="24"/>		
	<PARAM name="oppervlakte3" value="64"/>							
	<PARAM name="figuurgrijs3" value="0,0|8,0|10,8|2,8"/>					
	<PARAM name="oppervlaktegrijs3" value="64"/>					
	
	<PARAM name="figuur4" value="3,0|11,3|11,11|0,11|3,3"/>											
	<PARAM name="grid4" value="20"/>		
	<PARAM name="oppervlakte4" value="88"/>							
	<PARAM name="figuurgrijs4" value="0,0|9,0|9,1|16,1|16,9|0,3"/>					
	<PARAM name="oppervlaktegrijs4" value="89"/>					

	<PARAM name="figuur5" value="0,0|2,0|2,2|5,2|5,4|7,4|7,6|0,6"/>							
	<PARAM name="grid5" value="26"/>	
	<PARAM name="oppervlakte5" value="28"/>								
	<PARAM name="figuurgrijs5" value="0,0|9,0|9,2|7,2|7,4|1,4|1,2|0,2"/>					
	<PARAM name="oppervlaktegrijs5" value="30"/>					

	<PARAM name="figuur6" value="0,2|4,2|4,0|8,0|8,4|0,6"/>							
	<PARAM name="grid6" value="36"/>	
	<PARAM name="oppervlakte6" value="32"/>								
	<PARAM name="figuurgrijs6" value="2,0|6,0|6,1|8,1|8,4|6,4|6,5|2,5|2,4|0,4|0,1|2,1"/>					
	<PARAM name="oppervlaktegrijs6" value="32"/>					


</APPLET>
</BODY>
</HTML>
