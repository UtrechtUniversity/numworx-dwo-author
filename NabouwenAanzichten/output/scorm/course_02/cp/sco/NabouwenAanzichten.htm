<HTML>
	<HEAD>
		<TITLE>NabouwenAanzichten</TITLE>
		<SCRIPT type="text/javascript" src="script/FiScoScript.js"></SCRIPT>
		<SCRIPT>
			var exitPageStatus;
			
			function quit()
			{	if (exitPageStatus != true)
				{	nabouwenaanzichten.stopSco();
					exit();
					exitPageStatus=true;
				}
			}
		</SCRIPT>
	</HEAD>
	<BODY  bgcolor="#DDEEFF" onload="javascript:init();" onbeforeunload="javascript:quit();" onunload="javascript:quit();">
		<center>
		<h1>Maak de hoogtekaart</h1>
		
		<APPLET
			id		= "nabouwenaanzichten"
			name	= "nabouwenaanzichten"
			codebase= "http://www.fi.uu.nl/javaclasses/"
			code	= "fi.nabouwenaanzichten.NabouwenAanzichten.class"
			width	= "770"
			height	= "480"
			archive = "jars/nabouwenaanzichten.jar"
			mayscript="mayscript">
			<PARAM NAME="API" VALUE="fi.beans.scorm.JSScormAPI"/>
			<PARAM NAME="bgcolor" VALUE="#DDEEFF"/>
			<PARAM NAME="language" VALUE="nl"/>
			<PARAM NAME="variant" VALUE="1"/>
		</APPLET>
	</BODY>
</HTML>
