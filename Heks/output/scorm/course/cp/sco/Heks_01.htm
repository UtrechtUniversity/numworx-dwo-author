<HTML>
	<HEAD>
		<TITLE>De toverdrank. Blokjes erbij</TITLE>
		<SCRIPT type="text/javascript" src="script/FiScoScript.js"></SCRIPT>
		<SCRIPT>
			var exitPageStatus;
			
			function quit()
			{	if (exitPageStatus != true)
				{	heks.stopSco();
					exit();
					exitPageStatus=true;
				}
			}
		</SCRIPT>
	</HEAD>
	<BODY  bgcolor="#DDEEFF" onload="javascript:init();" onbeforeunload="javascript:quit();" onunload="javascript:quit();">
		<center>
		<h1>De toverdrank. Blokjes erbij</h1>
		<APPLET
			id		= "heks"
			name	= "heks"
			codebase= "http://www.fi.uu.nl/javaclasses"
			code	= "fi.heks.Heks.class"
			width	= "780"
			height	= "480"
			archive = "jars/heks.jar"
			mayscript="mayscript">
			<PARAM NAME="API" VALUE="fi.beans.scorm.JSScormAPI"/>
			<PARAM NAME="bgcolor" VALUE="#DDEEFF"/>
			<PARAM name="color_01" value="#FFFFEE"/>
			<PARAM NAME="language" VALUE="nl"/>
			<PARAM NAME="blad" VALUE="1"/>
		</APPLET>
	</BODY>
</HTML>
